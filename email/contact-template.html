<div style="margin:0;padding:0;background-color:#e7eef8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#e7eef8;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:18px;overflow:hidden;">
          <tr>
            <td style="background-color:#0b1a3a;padding:28px 32px 24px;">
              <div style="font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.2;color:#ffffff;">
                Widdy<span style="color:#d4af37;">·</span>Louis
              </div>
              <div style="margin-top:14px;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#d4af37;">
                Nouveau message
              </div>
              <div style="margin-top:8px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.25;color:#ffffff;">
                {{name}} vous a écrit
              </div>
            </td>
          </tr>
          <tr>
            <td style="height:4px;background-color:#d4af37;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px;font-family:Arial,Helvetica,sans-serif;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:0 0 16px;width:88px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a93a6;">Nom</td>
                  <td style="padding:0 0 16px;font-size:16px;color:#0b1a3a;"><strong>{{name}}</strong></td>
                </tr>
                <tr>
                  <td style="padding:0 0 16px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a93a6;">E-mail</td>
                  <td style="padding:0 0 16px;font-size:16px;">
                    <a href="mailto:{{email}}" style="color:#0b1a3a;text-decoration:none;">{{email}}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 8px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a93a6;">Reçu le</td>
                  <td style="padding:0 0 8px;font-size:15px;color:#0b1a3a;">{{time}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 28px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a93a6;margin-bottom:10px;">
                Message
              </div>
              <div style="font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.6;color:#0b1a3a;background-color:#f7f4ea;border-radius:12px;padding:18px 20px;">
                {{message}}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px;">
              <a href="mailto:{{email}}" style="display:inline-block;background-color:#0b1a3a;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;letter-spacing:0.04em;text-decoration:none;padding:14px 22px;border-radius:999px;">
                Répondre à {{name}}
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 22px;border-top:1px solid #e6eaf2;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#8a93a6;">
              Envoyé depuis le formulaire du portfolio.<br>
              Widdy Louis · Développeur front-end
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
